<div class="trash-container">
  
  <div class="trash-header">
    <h1 class="page-title">Trash</h1>
    <p class="info-text">
      <i class="fas fa-clock"></i> Files in trash will be automatically deleted after 30 days
    </p>
  </div>

   <!-- Empty State -->
   @if (trashedFiles.length === 0) {
    <div class="empty-state">
    <div class="empty-icon">
      <i class="fas fa-trash-alt"></i>
    </div>
    <h2 class="empty-title">Trash is empty</h2>
    <p class="empty-message">No files in the trash.</p>
  </div>
   } @else {
    <div class="action-bar">
      <button class="empty-trash-btn" (click)="emptyTrash()">
        <i class="fas fa-trash-alt"></i> Empty Trash </button>
      <span class="file-count"> {{ trashedFiles.length }} items</span> 
    </div>

    <div class="files-list">
      @for (file of trashedFiles; track file.id) {
        <div class="file-item">
          {{ file.name }}
        </div>
      }
    </div>
   }
  

  
</div>
